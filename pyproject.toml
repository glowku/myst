[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "myst-persistence"
version = "2.0.0"
description = "A universal cognitive persistence layer for AI agents: episodic journal, semantic consolidation, verified integrity, injectable state."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "glowku" }]
keywords = ["ai-agents", "memory", "persistence", "adr", "llm", "context-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # zero runtime dependency by design

[project.urls]
Homepage = "https://github.com/glowku/myst-persistence"
Documentation = "https://github.com/glowku/myst-persistence#readme"

[project.scripts]
myst = "myst_persistence.cli:main"

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["myst_persistence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
